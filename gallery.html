<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>OBVIO STUDIO — Profile</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #f3f2ee;
    --paper: #fbfaf7;
    --ink: #121212;
    --ink-2: #4a4945;
    --muted: #8d8a83;
    --line: #dcd9d2;
    --line-2: #c9c5bc;
    --sel: #121212;
    --ok: #2f6b3a;
    --warn: #9a3b1e;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    --gutter: 16px;
    --bar-h: 0px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  body { min-height: 100dvh; padding-bottom: calc(var(--bar-h) + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  .mono { font-family: var(--mono); letter-spacing: .02em; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 var(--gutter); }

  /* ---------- header ---------- */
  .top { display: flex; justify-content: space-between; align-items: center; height: 56px; border-bottom: 1px solid var(--line); }
  .mark { font-weight: 700; font-size: 13px; letter-spacing: .32em; }
  .mark span { font-weight: 400; color: var(--muted); letter-spacing: .12em; margin-left: 8px; }
  .top .mono { font-size: 11px; color: var(--muted); }

  /* ---------- gate ---------- */
  .gate { min-height: calc(100dvh - 56px); display: flex; flex-direction: column; padding-top: clamp(40px, 12vh, 120px); padding-bottom: 60px; }
  .gate form { width: 100%; max-width: 400px; margin: 0 auto; }
  .gate .label { font: 11px var(--mono); color: var(--muted); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 14px; }
  .gate h1 { font-size: 28px; line-height: 1.25; font-weight: 600; letter-spacing: -.03em; margin: 0 0 10px; word-break: keep-all; }
  .gate p { color: var(--ink-2); font-size: 14.5px; line-height: 1.6; margin: 0 0 32px; word-break: keep-all; }
  .pin { display: block; width: 100%; height: 64px; border: 0; border-bottom: 2px solid var(--ink); background: transparent; border-radius: 0;
         padding: 0 2px; font: 500 28px var(--mono); letter-spacing: .5em; color: var(--ink); outline: none; -webkit-appearance: none; appearance: none;
         -webkit-text-security: disc; text-security: disc; caret-color: var(--ink); }
  .pin:focus { border-bottom-color: var(--ink); }
  .gate .go { display: block; width: 100%; height: 54px; margin-top: 28px; border: 0; background: var(--ink); color: var(--paper); font-size: 16px; font-weight: 600; letter-spacing: .02em; }
  .gate .go:disabled { background: var(--line-2); color: var(--paper); }
  .gate .help { margin-top: 22px; font-size: 12.5px; color: var(--muted); line-height: 1.6; word-break: keep-all; }
  .shake { animation: shake .35s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  /* 아이폰·카카오톡 브라우저에서 입력칸을 누를 때 화면이 확대되지 않도록 16px 이상 유지 */
  input, select, textarea { font-size: max(16px, 1em); }
  .err { color: var(--warn); font-size: 13.5px; min-height: 20px; margin-top: 12px; }

  /* ---------- hero ---------- */
  .hero { padding-top: 36px; padding-bottom: 24px; display: grid; gap: 18px; }
  .hero .label { font: 11px var(--mono); color: var(--muted); letter-spacing: .14em; text-transform: uppercase; }
  .hero h1 { font-size: clamp(28px, 6vw, 44px); line-height: 1.1; font-weight: 600; letter-spacing: -.03em; margin: 6px 0 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-2); }
  .meta b { font-weight: 600; color: var(--ink); }

  .steps { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--ink); }
  .step { padding: 12px 0 0; font-size: 13px; color: var(--muted); border-top: 3px solid transparent; margin-top: -2px; }
  .step .n { font: 11px var(--mono); display: block; margin-bottom: 4px; }
  .step.done { color: var(--ink-2); }
  .step.now { color: var(--ink); border-top-color: var(--ink); font-weight: 600; }

  .notice { background: var(--paper); border: 1px solid var(--line); padding: 16px 18px; font-size: 14px; line-height: 1.65; color: var(--ink-2); }
  .notice strong { color: var(--ink); font-weight: 600; }
  .notice .sub { display: block; margin-top: 6px; font-size: 12.5px; color: var(--muted); }

  /* ---------- toolbar ---------- */
  .tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-top: 8px; }
  .tab { border: 0; background: none; padding: 14px 0 12px; font-size: 15px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.on { color: var(--ink); border-color: var(--ink); font-weight: 600; }
  .tab .c { font: 11px var(--mono); margin-left: 4px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 14px 0; }
  .chips { display: flex; gap: 6px; }
  /* 1차·2차·3차 */
  .rounds { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--ink); margin-top: 16px; }
  .round { border: 0; border-left: 1px solid var(--ink); background: transparent; padding: 10px 8px 9px; text-align: left; display: grid; gap: 2px; }
  .round:first-child { border-left: 0; }
  .round .t { font-size: 14px; font-weight: 600; }
  .round .d { font-size: 11.5px; color: var(--muted); }
  .round .k { font: 600 12px var(--mono); }
  .round.on { background: var(--ink); color: var(--paper); }
  .round.on .d { color: #bdbab3; }
  .round:disabled { opacity: .35; cursor: default; }
  .rhint { font-size: 13px; color: var(--ink-2); margin: 10px 0 0; line-height: 1.55; word-break: keep-all; }
  .chip { border: 1px solid var(--line-2); background: transparent; padding: 7px 12px; font-size: 13px; border-radius: 999px; }
  .chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn { border: 1px solid var(--ink); background: transparent; padding: 9px 14px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
  .btn.solid { background: var(--ink); color: var(--paper); }
  .btn:disabled { opacity: .35; cursor: default; }
  .hint { font-size: 12.5px; color: var(--muted); }

  /* ---------- grid ---------- */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding-bottom: 40px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 8px; } }
  @media (min-width: 1000px) { .grid { grid-template-columns: repeat(6, 1fr); gap: 10px; } }
  /* 사진이 잘리지 않도록 전체를 보여줌 (세로 2:3 기준 칸, 가로 사진은 위아래 여백) */
  .cell { position: relative; aspect-ratio: 2 / 3; background: #e6e3dc; overflow: hidden; border: 0; padding: 0; display: block; width: 100%; }
  .cell img { width: 100%; height: 100%; object-fit: contain; display: block; transition: opacity .3s; opacity: 0; }
  .cell img.ld { opacity: 1; }
  .cell .ph { position: absolute; inset: 0; display: grid; place-items: center; font: 10px var(--mono); color: var(--muted); padding: 6px; text-align: center; word-break: break-all; }
  .cell .nm { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 6px 5px; font: 10px var(--mono); color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.45)); text-align: left; opacity: 0; transition: opacity .2s; }
  @media (hover: hover) { .cell:hover .nm { opacity: 1; } }
  .cell.sel::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 3px var(--sel); pointer-events: none; }
  .pick { position: absolute; top: 0; right: 0; width: 44px; height: 44px; border: 0; background: none; padding: 0; display: grid; place-items: center; }
  .pick i { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #fff; background: rgba(0,0,0,.18); display: grid; place-items: center; font: 600 11px var(--mono); color: #fff; font-style: normal; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .cell.sel .pick i { background: var(--sel); border-color: var(--sel); }
  .empty { padding: 60px 0; text-align: center; color: var(--muted); font-size: 14px; grid-column: 1 / -1; }

  /* ---------- bottom bar ---------- */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper); border-top: 1px solid var(--ink); padding: 12px var(--gutter) calc(12px + env(safe-area-inset-bottom)); z-index: 20; }
  .dock .in { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
  .count { font: 600 20px var(--mono); }
  .count small { font-size: 13px; color: var(--muted); font-weight: 400; }
  .meter { flex: 1; height: 2px; background: var(--line); position: relative; min-width: 40px; }
  .meter span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); transition: width .25s; }
  .dock .btn { padding: 12px 18px; font-size: 14px; }

  /* ---------- lightbox ---------- */
  /* minmax(0,1fr) + 사진 절대 위치: 사파리에서 사진 높이 때문에 칸이 커져 아래가 잘리던 문제 방지 */
  .lb { position: fixed; inset: 0; height: 100%; background: #0d0d0d; color: #eee; z-index: 50; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
  .lb-top, .lb-bot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px var(--gutter); padding-top: calc(10px + env(safe-area-inset-top)); }
  .lb-bot { padding-bottom: calc(14px + env(safe-area-inset-bottom)); padding-top: 10px; }
  .lb-top .mono { font-size: 12px; color: #aaa; }
  .lb-x { border: 0; background: none; color: #eee; font-size: 26px; width: 44px; height: 44px; line-height: 1; }
  .lb-stage { position: relative; min-height: 0; display: grid; place-items: center; overflow: hidden; touch-action: pan-y; }
  .lb-stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }
  .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 72px; border: 0; background: rgba(255,255,255,.06); color: #ddd; font-size: 22px; }
  .lb-nav.p { left: 8px; } .lb-nav.n { right: 8px; }
  @media (hover: none) { .lb-nav { display: none; } }
  .lb .btn { border-color: #eee; color: #eee; }
  .lb .btn.solid { background: #eee; color: #111; }
  .lb .btn.picked { background: #eee; color: #111; }
  .lb-load { position: absolute; font: 11px var(--mono); color: #777; }

  /* ---------- modal / toast ---------- */
  .modal { position: fixed; inset: 0; background: rgba(18,18,18,.45); z-index: 60; display: grid; place-items: end center; }
  @media (min-width: 640px) { .modal { place-items: center; } }
  .sheet { background: var(--paper); width: min(560px, 100%); max-height: 86dvh; overflow: auto; padding: 24px var(--gutter) calc(20px + env(safe-area-inset-bottom)); }
  @media (min-width: 640px) { .sheet { padding: 28px; } }
  .sheet h2 { font-size: 20px; margin: 0 0 6px; letter-spacing: -.02em; }
  .sheet p { font-size: 14px; color: var(--ink-2); line-height: 1.6; margin: 0 0 16px; }
  .mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 14px; }
  .mini figure { margin: 0; }
  .mini img, .mini .ph2 { width: 100%; aspect-ratio: 2/3; object-fit: contain; background: #e6e3dc; display: block; }
  .mini figcaption { font: 9.5px var(--mono); color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .actions .btn { padding: 12px 18px; font-size: 14px; }
  .prog { height: 2px; background: var(--line); margin: 14px 0 8px; position: relative; }
  .prog span { position: absolute; inset: 0 auto 0 0; background: var(--ink); width: 0; transition: width .2s; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--bar-h) + 20px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--paper); font-size: 13.5px; padding: 11px 16px; z-index: 70; max-width: calc(100% - 32px); }
  .foot { border-top: 1px solid var(--line); padding-top: 22px; padding-bottom: 40px; font-size: 12.5px; color: var(--muted); line-height: 1.7; }
  .loading { padding: 80px 0; text-align: center; font: 12px var(--mono); color: var(--muted); }
</style>
</head>
<body>
<header class="wrap top">
  <div class="mark">OBVIO STUDIO<span>Profile</span></div>
  <div class="mono" id="topRight"></div>
</header>

<!-- 비밀번호 -->
<section class="wrap gate" id="gate" hidden>
  <form id="gateForm" autocomplete="off" novalidate>
    <div class="label">Profile photos</div>
    <h1>촬영 사진 보기</h1>
    <p>카카오톡으로 받은 숫자 비밀번호를 입력해 주세요.</p>
    <input id="pin" class="pin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="8"
           autocomplete="off" autocorrect="off" spellcheck="false" aria-label="비밀번호">
    <div class="err" id="gateErr" role="alert"></div>
    <button class="go" id="gateBtn" disabled>입장하기</button>
    <div class="help">사진 확인, 보정할 사진 선택, 저장까지<br>모두 이 페이지에서 할 수 있어요.</div>
  </form>
</section>

<div class="loading" id="loading">불러오는 중…</div>

<!-- 본문 -->
<main id="main" hidden>
  <section class="wrap hero">
    <div>
      <div class="label" id="heroLabel">Profile session</div>
      <h1 id="heroName"></h1>
    </div>
    <div class="meta" id="heroMeta"></div>
    <div class="steps" id="steps">
      <div class="step" data-s="1"><span class="n">01</span>사진 선택</div>
      <div class="step" data-s="2"><span class="n">02</span>보정 중</div>
      <div class="step" data-s="3"><span class="n">03</span>보정본 전달</div>
    </div>
    <div class="notice" id="notice"></div>
  </section>

  <section class="wrap">
    <nav class="tabs" id="tabs" hidden>
      <button class="tab" data-tab="retouched">보정본<span class="c" id="cRet"></span></button>
      <button class="tab" data-tab="originals">원본<span class="c" id="cOrig"></span></button>
    </nav>
    <div id="roundBox" hidden>
      <div class="rounds" id="rounds">
        <button class="round" data-r="0"><span class="t">1차</span><span class="d">전체에서</span><span class="k" id="rk0"></span></button>
        <button class="round" data-r="1"><span class="t">2차</span><span class="d">1차 중에서</span><span class="k" id="rk1"></span></button>
        <button class="round" data-r="2"><span class="t">3차 · 최종</span><span class="d" id="rd2"></span><span class="k" id="rk2"></span></button>
      </div>
      <p class="rhint" id="rhint"></p>
    </div>
    <div class="bar">
      <div class="chips" id="chips">
        <button class="chip on" data-f="all">전체 <span class="mono" id="nAll"></span></button>
        <button class="chip" data-f="sel">선택한 사진 <span class="mono" id="nSel"></span></button>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span class="hint" id="dlHint"></span>
        <button class="btn" id="saveAll">전체 저장</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <footer class="wrap foot">
    문의는 카카오톡 채널 <b style="color:var(--ink-2)">오비오 스튜디오</b>로 말씀해 주세요.<br>
    <span class="mono">OBVIO STUDIO · Jamsil, Seoul</span>
  </footer>
</main>

<!-- 하단 선택 바 -->
<div class="dock" id="dock" hidden>
  <div class="in">
    <div class="count" id="dockCount">0<small> / 0</small></div>
    <div class="meter"><span id="meter"></span></div>
    <button class="btn solid" id="submitBtn" disabled>선택 완료</button>
  </div>
</div>

<!-- 크게 보기 -->
<div class="lb" id="lb" hidden>
  <div class="lb-top">
    <div class="mono" id="lbInfo"></div>
    <button class="lb-x" id="lbClose" aria-label="닫기">×</button>
  </div>
  <div class="lb-stage" id="lbStage">
    <span class="lb-load" id="lbLoad">loading</span>
    <img id="lbImg" alt="">
    <button class="lb-nav p" id="lbPrev" aria-label="이전">‹</button>
    <button class="lb-nav n" id="lbNext" aria-label="다음">›</button>
  </div>
  <div class="lb-bot">
    <a class="btn" id="lbDl" href="#" rel="noopener">원본 저장</a>
    <button class="btn" id="lbPick">선택하기</button>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="/gallery-zip.js"></script>
<script>
(() => {
  const API = '/api/gallery-client';
  const $ = (id) => document.getElementById(id);
  const slug = (location.pathname.match(/\/g\/([a-z0-9]+)/) || [])[1] || new URLSearchParams(location.search).get('g') || '';
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
  };
  const TK = `obvio-g-token-${slug}`, SK = `obvio-g-sel-${slug}`;

  // 보정 작가용 링크 (#r=토큰): 비밀번호 없이 고객이 고른 원본만 보기·받기
  const RT = (location.hash.match(/[#&]r=([^&]+)/) || [])[1] || null;
  // rounds: 1차·2차·3차 선택 (2차는 1차의 일부, 3차는 2차의 일부). final: 완료된 최종 선택
  const S = { token: RT || store.get(TK), role: RT ? 'retoucher' : 'client', g: null, originals: [], retouched: [], rounds: [new Set(), new Set(), new Set()], round: 0, final: new Set(), tab: 'originals', filter: 'all', lbList: [], lbIdx: 0 };
  const ROUND_NAME = ['1차', '2차', '3차'];
  const selecting = () => S.g && S.g.status === 'selecting' && S.role !== 'retoucher';
  const cur = () => (selecting() ? S.rounds[S.round] : S.final);          // 지금 보고 있는 선택
  const roundLimit = (r) => (r === 2 && S.g.select_limit > 0 ? S.g.select_limit : 0); // 1·2차는 무제한
  function pool(r = S.round) {                                             // 이 차수에서 고를 수 있는 사진
    if (!selecting() || r === 0) return S.originals;
    return S.originals.filter((p) => S.rounds[r - 1].has(p.id));
  }
  // 선택은 이 기기(즉시)와 서버(잠깐 뒤 자동)에 함께 저장 → 폰에서 고르다 PC에서 이어서
  const draftNow = () => ({ v: 2, round: S.round, r: S.rounds.map((x) => [...x]), t: Date.now() });
  let draftTimer = null, draftDirty = false;
  function pushDraft(keepalive) {
    clearTimeout(draftTimer); draftTimer = null;
    if (!draftDirty || !selecting()) return;
    draftDirty = false;
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: !!keepalive,
      body: JSON.stringify({ action: 'save-draft', slug, token: S.token, draft: draftNow() }) })
      .then((r) => { if (!r.ok && r.status !== 409) draftDirty = true; })
      .catch(() => { draftDirty = true; });
  }
  function saveDraft() {
    store.set(SK, JSON.stringify(draftNow()));
    draftDirty = true; clearTimeout(draftTimer); draftTimer = setTimeout(pushDraft, 700);
  }
  addEventListener('pagehide', () => pushDraft(true));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') pushDraft(true); });
  function loadDraft(valid, server) {
    let d = null; try { d = JSON.parse(store.get(SK) || 'null'); } catch {}
    // 이 기기 기록과 서버 기록 중 더 최근 것을 사용
    if (server && Array.isArray(server.r) && (!d || Array.isArray(d) || !(d.t > server.t))) d = server;
    let r = [[], [], []], round = 0;
    if (Array.isArray(d)) r = [d, [], []];                                  // 예전 방식(한 번에 고르기)으로 고르던 것
    else if (d && Array.isArray(d.r)) { r = d.r; round = Math.min(2, Math.max(0, d.round | 0)); }
    const a = new Set((r[0] || []).filter((id) => valid.has(id)));
    const b = new Set((r[1] || []).filter((id) => a.has(id)));
    let c = (r[2] || []).filter((id) => b.has(id));
    const lim = S.g.select_limit; if (lim > 0) c = c.slice(0, lim);
    S.rounds = [a, b, new Set(c)];
    while (round > 0 && !S.rounds[round - 1].size) round--;
    S.round = round;
  }

  async function call(action, data = {}) {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, slug, token: S.token, ...data }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.error || '연결이 원활하지 않아요.'); e.status = r.status; throw e; }
    return j;
  }

  let toastT;
  function toast(msg, ms = 2600) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), ms); }

  const fmtDate = (s) => { if (!s) return ''; const d = new Date(s.length === 10 ? s + 'T00:00:00' : s); return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`; };
  const fmtMD = (s) => { const d = new Date(s); return `${d.getMonth() + 1}월 ${d.getDate()}일`; };
  const fmtSize = (b) => (b > 1e9 ? (b / 1e9).toFixed(1) + 'GB' : Math.max(1, Math.round(b / 1e6)) + 'MB');
  const isMobile = matchMedia('(hover: none) and (pointer: coarse)').matches;

  // ---------- 입장 ----------
  function showGate(msg) {
    $('loading').hidden = true; $('main').hidden = true; $('dock').hidden = true; $('gate').hidden = false;

  }
  $('pin').addEventListener('input', (e) => {

      S.token = token; store.set(TK, token);

  async function load() {
    try {
      const d = await call('get');
      S.g = d.gallery; S.originals = d.originals; S.retouched = d.retouched; S.role = d.role || S.role;
      const valid = new Set(S.originals.map((p) => p.id));
      S.final = new Set(S.g.selected || []);
      if (selecting()) {
        loadDraft(valid, d.draft);
        store.set(SK, JSON.stringify(draftNow()));
        if (!d.draft && S.rounds[0].size) { draftDirty = true; pushDraft(); } // 이 기기에만 있던 기록을 서버로
      }

    } catch (err) {
      if (RT) { $('loading').textContent = err.status === 401 ? '링크가 만료됐어요. 새 링크를 요청해 주세요.' : err.message; return; }

      else { $('loading').textContent = err.message; }

  }

  // ---------- 화면 ----------
  function render() {

      n.innerHTML = `<strong>고객이 고른 원본 ${S.originals.length}장이에요.</strong> "'선택 원본 전체 zip 받기'를 누르면 한 번에 받을 수 있어요."<span class="sub">${origLine} 사진의 번호는 고객이 고른 순서예요.</span>`;

    else if (g.status === 'selecting') n.innerHTML = `<strong>세 번에 나눠 골라요.</strong> 1차·2차는 마음에 드는 사진을 장수 제한 없이 추리고, 3차에서 ${g.select_limit > 0 ? `보정받을 <strong>${g.select_limit}장</strong>을` : '최종 사진을'} 골라주세요. 사진을 누르면 크게 볼 수 있고, 오른쪽 위 동그라미를 누르면 선택돼요.<span class="sub">완료 전에는 위의 1차·2차·3차를 눌러 언제든 돌아가 고칠 수 있어요. 고른 사진은 자동 저장돼서, 폰에서 고르다가 PC에서 같은 링크로 이어서 골라도 돼요. ${origLine}</span>`;
    else if (g.status === 'selected') n.innerHTML = `<strong>선택이 완료됐어요.</strong> 보정본은 촬영일 기준 7일 후 이 페이지에 올라와요.<span class="sub">${fmtMD(g.selected_at)} 선택 · ${S.final.size}장. ${origLine}</span>`;
    else n.innerHTML = `<strong>보정본이 도착했어요.</strong> ${g.retouched_expire_at ? `<strong>${fmtMD(g.retouched_expire_at)}</strong>까지 저장할 수 있어요.` : ''}<span class="sub">${origLine}</span>`;

    $('tabs').hidden = !(g.status === 'delivered' && S.retouched.length);
    $('cRet').textContent = S.retouched.length; $('cOrig').textContent = S.originals.length;
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.dataset.tab === S.tab));

    const sel = selecting();
    $('dock').hidden = !sel;
    $('roundBox').hidden = !sel;

  }

  function renderRounds() {
    if (!selecting()) return;
    const lim = S.g.select_limit;
    $('rd2').textContent = lim > 0 ? `${lim}장 고르기` : '2차 중에서';
    [0, 1, 2].forEach((r) => {
      const b = document.querySelector(`.round[data-r="${r}"]`);
      b.classList.toggle('on', r === S.round);
      b.disabled = r > 0 && !S.rounds[r - 1].size;
      $(`rk${r}`).textContent = r === 2 && lim > 0 ? `${S.rounds[2].size} / ${lim}` : `${S.rounds[r].size}장`;
    });
    const n = pool().length;
    $('rhint').textContent = [
      `전체 ${n}장 중 마음에 드는 사진을 장수 제한 없이 모두 골라주세요.`,
      `1차에서 고른 ${n}장 중 다시 추려주세요. 장수 제한은 없어요.`,
      lim > 0 ? `2차에서 고른 ${n}장 중 보정받을 ${lim}장을 골라주세요.` : `2차에서 고른 ${n}장 중 최종 사진을 골라주세요.`,
    ][S.round];
  }

  function goRound(r) {
    if (r === S.round || (r > 0 && !S.rounds[r - 1].size)) return;
    S.round = r; S.filter = 'all'; saveDraft();
    renderGrid();

  }
  $('rounds').addEventListener('click', (e) => { const b = e.target.closest('.round'); if (b && !b.disabled) goRound(+b.dataset.r); });

  function currentList() {
    if (S.tab === 'retouched') return S.retouched;
    const base = pool();
    return S.filter === 'sel' ? base.filter((p) => cur().has(p.id)) : base;
  }

  function renderGrid() {
    const g = S.g, onOrig = S.tab === 'originals';
    $('chips').hidden = !(onOrig && S.originals.length) || S.role === 'retoucher';
    $('nAll').textContent = pool().length; $('nSel').textContent = cur().size;
    document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c.dataset.f === S.filter));

    const list = currentList();
    const dl = saveList();
    const total = dl.reduce((a, p) => a + (p.size || 0), 0);
    const rt = S.role === 'retoucher';
    $('saveAll').hidden = !dl.length || (isMobile && !rt);
    $('saveAll').textContent = `${rt ? '선택 원본' : S.tab === 'retouched' ? '보정본' : S.filter === 'sel' ? '선택 사진' : '원본'} 전체 zip 받기${total ? ' · ' + fmtSize(total) : ''}`;
    $('dlHint').textContent = dl.length && isMobile && !rt ? '사진을 열어 한 장씩 저장할 수 있어요' : '';
    renderRounds();

    const grid = $('grid'); grid.innerHTML = '';
    if (!list.length) {
      const e = document.createElement('div'); e.className = 'empty';
      e.textContent = g.status === 'uploading' ? '곧 사진이 올라와요.' : S.filter === 'sel' ? '아직 선택한 사진이 없어요.' : '사진이 없어요.';
      grid.append(e);
    }
    const frag = document.createDocumentFragment();
    const canPick = selecting() && onOrig;
    const cs = cur();
    list.forEach((p, i) => {
      const c = document.createElement('div'); c.className = 'cell'; c.dataset.id = p.id; c.dataset.i = i;
      c.setAttribute('role', 'button'); c.tabIndex = 0;
      if (onOrig && cs.has(p.id)) c.classList.add('sel');
      if (p.thumb) {
        const img = new Image(); img.loading = 'lazy'; img.decoding = 'async'; img.alt = p.filename; img.src = p.thumb;
        img.onload = () => img.classList.add('ld'); c.append(img);
      } else { const ph = document.createElement('div'); ph.className = 'ph'; ph.textContent = p.filename; c.append(ph); }
      const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = p.filename; c.append(nm);
      if (canPick || (onOrig && cs.has(p.id))) {
        const b = document.createElement('button'); b.className = 'pick'; b.setAttribute('aria-label', '선택');
        b.innerHTML = '<i></i>'; c.append(b);
      }
      frag.append(c);
    });
    grid.append(frag);
    updateMarks();
  }

  // 1·2차는 체크 표시, 3차(최종)와 완료 후에는 고른 순서 번호
  const numbered = () => !selecting() || S.round === 2;
  function updateMarks() {
    const cs = cur(), order = [...cs];
    document.querySelectorAll('#grid .cell').forEach((c) => {
      const on = S.tab === 'originals' && cs.has(c.dataset.id);
      c.classList.toggle('sel', on);
      const i = c.querySelector('.pick i'); if (i) i.textContent = on ? (numbered() ? order.indexOf(c.dataset.id) + 1 : '✓') : '';
    });
    $('nSel').textContent = cs.size;
    if (!selecting()) return;
    const lim = roundLimit(S.round), n = cs.size;
    const unlimited = !(lim > 0);
    $('dockCount').innerHTML = unlimited ? `${n}<small> 장 · ${ROUND_NAME[S.round]}</small>` : `${n}<small> / ${lim}</small>`;
    $('meter').parentElement.style.visibility = unlimited ? 'hidden' : '';
    if (!unlimited) $('meter').style.width = Math.min(100, (n / lim) * 100) + '%';
    const btn = $('submitBtn');
    btn.disabled = n === 0;
    if (S.round < 2) btn.textContent = `${ROUND_NAME[S.round + 1]} 고르기 →`;

  }

  function toggle(id) {
    if (!selecting()) return false;
    const set = S.rounds[S.round];
    if (set.has(id)) {
      set.delete(id);
      // 앞 차수에서 빼면 뒤 차수에서도 함께 빠짐
      let dropped = 0;
      for (let r = S.round + 1; r < 3; r++) if (S.rounds[r].delete(id)) dropped = r;
      if (dropped) toast(`${ROUND_NAME.slice(S.round + 1, dropped + 1).join('·')} 선택에서도 함께 뺐어요.`);
    } else {
      const lim = roundLimit(S.round);
      if (lim > 0 && set.size >= lim) { toast(`${lim}장까지 고를 수 있어요. 다른 사진을 빼고 골라주세요.`); return false; }
      set.add(id);
    }
    saveDraft();
    if (S.filter === 'sel') renderGrid(); else updateMarks();
    return true;
  }

  $('grid').addEventListener('click', (e) => {
    const c = e.target.closest('.cell'); if (!c) return;
    if (e.target.closest('.pick')) { e.stopPropagation(); toggle(c.dataset.id); return; }
    openLB(+c.dataset.i);
  });
  $('grid').addEventListener('keydown', (e) => { if (e.key === 'Enter') { const c = e.target.closest('.cell'); if (c) openLB(+c.dataset.i); } });
  $('chips').addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (b) { S.filter = b.dataset.f; renderGrid(); } });
  $('tabs').addEventListener('click', (e) => { const b = e.target.closest('.tab'); if (b) { S.tab = b.dataset.tab; S.filter = 'all'; render(); } });

  // ---------- 크게 보기 ----------
  function openLB(i) { S.lbList = currentList(); S.lbIdx = i; $('lb').hidden = false; document.body.style.overflow = 'hidden'; showLB(); }
  function closeLB() { $('lb').hidden = true; document.body.style.overflow = ''; $('lbImg').removeAttribute('src'); }
  function showLB() {
    const p = S.lbList[S.lbIdx]; if (!p) return closeLB();
    const img = $('lbImg'); img.style.opacity = 0; $('lbLoad').hidden = false;
    img.onload = () => { img.style.opacity = 1; $('lbLoad').hidden = true; };
    img.src = p.preview || p.thumb || ''; img.alt = p.filename;
    $('lbInfo').textContent = `${selecting() && S.tab === 'originals' ? ROUND_NAME[S.round] + ' · ' : ''}${p.filename}   ${S.lbIdx + 1} / ${S.lbList.length}`;
    const dl = $('lbDl'); dl.hidden = !p.download; if (p.download) dl.href = p.download;
    dl.textContent = S.tab === 'retouched' ? '보정본 저장' : '원본 저장';
    const canPick = selecting() && S.tab === 'originals';
    const cs = cur();
    const pk = $('lbPick'); pk.hidden = !canPick && !(S.tab === 'originals' && cs.has(p.id));
    pk.disabled = !canPick;
    const on = cs.has(p.id);
    pk.classList.toggle('picked', on); pk.textContent = on ? (numbered() ? `✓ 선택됨 ${[...cs].indexOf(p.id) + 1}` : '✓ 선택됨') : '선택하기';
    [S.lbList[S.lbIdx + 1], S.lbList[S.lbIdx - 1]].forEach((q) => { if (q && q.preview) new Image().src = q.preview; });
  }
  const step = (d) => { const n = S.lbIdx + d; if (n >= 0 && n < S.lbList.length) { S.lbIdx = n; showLB(); } };
  $('lbClose').onclick = closeLB;
  $('lbPrev').onclick = () => step(-1);
  $('lbNext').onclick = () => step(1);
  $('lbPick').onclick = () => { const p = S.lbList[S.lbIdx]; if (toggle(p.id)) showLB(); if (S.filter === 'sel') { S.lbList = currentList(); S.lbIdx = Math.min(S.lbIdx, S.lbList.length - 1); showLB(); } };
  document.addEventListener('keydown', (e) => {
    if ($('lb').hidden) return;
    if (e.key === 'Escape') closeLB(); else if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === ' ' && !$('lbPick').disabled) { e.preventDefault(); $('lbPick').click(); }
  });
  let tx = null, ty = null;
  $('lbStage').addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  $('lbStage').addEventListener('touchend', (e) => {
    if (tx == null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
    else if (dy > 90 && Math.abs(dy) > Math.abs(dx)) closeLB();
  });

  // ---------- 선택 완료 ----------
  function openModal(html) { $('toast').hidden = true; $('sheet').innerHTML = html; $('modal').hidden = false; }
  function closeModal() { $('modal').hidden = true; }

  $('submitBtn').onclick = () => {

    const fin = S.rounds[2];
    const lim = S.g.select_limit, picked = S.originals.filter((p) => fin.has(p.id));
    const order = [...fin]; picked.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
    const short = lim > 0 ? lim - picked.length : 0;
    openModal(`
      <h2>${lim > 0 ? `이 ${picked.length}장으로 보정을 맡길까요?` : `${picked.length}장 선택을 완료할까요?`}</h2>
      <p>${short > 0 ? `<b style="color:var(--warn)">${short}장을 덜 골랐어요.</b> 이대로 완료하면 ${picked.length}장만 보정돼요.<br>` : ''}완료한 뒤에는 이 페이지에서 바꿀 수 없어요. 더 고치고 싶으면 '더 볼게요'를 누르고 1차·2차로 돌아가 보세요.</p>
      <div class="mini" id="miniList"></div>
      <div class="actions"><button class="btn" data-close>더 볼게요</button><button class="btn solid" id="confirmBtn">선택 완료</button></div>`);
    const ml = $('miniList');

      } catch (err) { e.target.disabled = false; e.target.textContent = '선택 완료'; toast(err.message, 4000); if (err.status === 409) { closeModal(); load(); } }
    };
  };

  // ---------- 전체 저장 (zip) ----------
  function saveList() {
    if (S.tab === 'retouched') return S.retouched.filter((p) => p.download);
    const base = S.filter === 'sel' ? S.originals.filter((p) => cur().has(p.id)) : S.originals;
    return base.filter((p) => p.download);
  }
  $('saveAll').onclick = async () => {
    const list = saveList();

    const parts = ObvioZip.plan(list, 1e9).length;
    const kind = S.role === 'retoucher' ? '보정용원본' : S.tab === 'retouched' ? '보정본' : S.filter === 'sel' ? '선택' : '원본';
    const name = `${fmtDate(S.g.shoot_date).replace(/\./g, '')}_${S.g.client_name}_${kind}`;
    let cancelled = false;
    openModal(`<h2>${list.length}장 zip으로 받기</h2>
      <p id="dlMsg">사진을 zip 파일로 묶어서 다운로드 폴더에 저장해요${total ? ` (${fmtSize(total)})` : ''}.${parts > 1 ? ` 용량이 커서 zip 파일 ${parts}개로 나눠서 받아요.` : ''} 받는 동안 이 창을 닫지 말아 주세요.</p>
      <div class="prog"><span id="dlBar"></span></div><div class="hint mono" id="dlTxt">0 / ${list.length}</div>
      <div class="actions"><button class="btn" id="dlCancel">닫기</button><button class="btn solid" id="dlGo">받기 시작</button></div>`);
    $('dlCancel').onclick = () => { cancelled = true; closeModal(); };
    $('dlGo').onclick = async (e) => {
      e.target.disabled = true;
      $('dlMsg').textContent = 'zip 파일을 만드는 중이에요. 창을 닫지 말아 주세요.';
      try {
        const r = await ObvioZip.saveZip(list, {
          name, isCancelled: () => cancelled,
          onProgress: (p) => {
            const ratio = p.fallback || !p.totalBytes ? p.done / p.total : Math.min(1, p.bytes / p.totalBytes);
            $('dlBar').style.width = ratio * 100 + '%';
            $('dlTxt').textContent = `${p.done} / ${p.total}${p.parts > 1 ? ` · 파일 ${p.part}/${p.parts}` : ''}`;
            if (p.fallback) $('dlMsg').textContent = '사진을 한 장씩 받고 있어요. 브라우저가 "여러 파일 다운로드"를 물으면 허용을 눌러주세요.';
          },
        });
        if (r.cancelled || cancelled) return;
        $('dlMsg').textContent = r.fallback ? '다운로드를 시작했어요.' : `저장이 끝났어요. 다운로드 폴더에서 zip 파일${r.parts > 1 ? ` ${r.parts}개` : ''}을 확인해 주세요.`;
        $('dlGo').hidden = true; $('dlCancel').textContent = '확인';
      } catch (err) {
        $('dlMsg').textContent = '저장 중 문제가 생겼어요. 페이지를 새로고침한 뒤 다시 시도해 주세요.'; e.target.disabled = false;
      }
    };
  };

  window.addEventListener('resize', () => { if (!$('dock').hidden) document.documentElement.style.setProperty('--bar-h', $('dock').offsetHeight + 'px'); });

  if (!slug) { $('loading').textContent = '링크가 올바르지 않아요. 안내받은 링크로 다시 들어와 주세요.'; return; }
  if (S.token) load(); else showGate();
})();
</script>
</body>
</html>
